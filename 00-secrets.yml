---
- name: Generate secrets on control node
  hosts: control
  gather_facts: false
  tasks:
    - name: Create secrets dir
      ansible.builtin.file: { path: "{{ secrets_dir }}", state: directory, mode: "0700" }
    - name: Generate / load secrets
      ansible.builtin.set_fact:
        _loaded: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/' ~ item ~ ' length=24 chars=ascii_letters,digits') | length }}"
      loop: "{{ secret_names }}"
      no_log: true
  any_errors_fatal: true
