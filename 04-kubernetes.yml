---
- name: "Task 4 - NFS server/clients"
  hosts: vps
  roles: [nfs]
  any_errors_fatal: true

- name: "Task 4 - k3s server"
  hosts: k3s_server
  roles: [k3s]
  any_errors_fatal: true

- name: "Task 4 - k3s agent"
  hosts: k3s_agent
  roles: [k3s]
  any_errors_fatal: true

- name: "Task 4 - K8s platform (storage, network policy, operators, ArgoCD)"
  hosts: k3s_server
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
  roles: [k8s_platform]
  any_errors_fatal: true

