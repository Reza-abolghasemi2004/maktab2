---
# رمزها اولین بار به‌صورت خودکار در .secrets/ ساخته می‌شوند (روی لپ‌تاپ).
# پوشه‌ی .secrets را با ansible-vault رمزنگاری یا امن نگه دارید و commit نکنید.
secrets_dir: "{{ inventory_dir }}/../.secrets"
secret_names:
  - pg_app_password
  - mariadb_root_password
  - mariadb_wp_password
  - redis_password
  - gitea_admin_password
  - registry_password
  - grafana_admin_password
  - k3s_token
  - teleport_node_token

pg_app_password:        "{{ lookup('ansible.builtin.password', secrets_dir ~ '/pg_app_password length=24 chars=ascii_letters,digits') }}"
mariadb_root_password:  "{{ lookup('ansible.builtin.password', secrets_dir ~ '/mariadb_root_password length=24 chars=ascii_letters,digits') }}"
mariadb_wp_password:    "{{ lookup('ansible.builtin.password', secrets_dir ~ '/mariadb_wp_password length=24 chars=ascii_letters,digits') }}"
redis_password:         "{{ lookup('ansible.builtin.password', secrets_dir ~ '/redis_password length=24 chars=ascii_letters,digits') }}"
gitea_admin_password:   "{{ lookup('ansible.builtin.password', secrets_dir ~ '/gitea_admin_password length=24 chars=ascii_letters,digits') }}"
registry_password:      "{{ lookup('ansible.builtin.password', secrets_dir ~ '/registry_password length=24 chars=ascii_letters,digits') }}"
grafana_admin_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/grafana_admin_password length=24 chars=ascii_letters,digits') }}"
k3s_token:              "{{ lookup('ansible.builtin.password', secrets_dir ~ '/k3s_token length=48 chars=ascii_letters,digits') }}"
teleport_node_token:    "{{ lookup('ansible.builtin.password', secrets_dir ~ '/teleport_node_token length=40 chars=ascii_letters,digits') }}"
