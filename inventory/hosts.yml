---
all:
  children:
   
    control:
      hosts:
        laptop:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          wg_ip: 10.8.0.10

    vps:
      vars:
        ansible_user: root
        
      hosts:
        vps1:
          ansible_host: 81.12.50.30
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          wg_ip: 10.8.0.1
        vps2:
          ansible_host: 31.56.89.69
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          wg_ip: 10.8.0.2

   
    edge:       { hosts: { vps1: } }   # nginx edge, DNS, VPN hub, PAM server, NFS, Gitea, Registry, Backup
    worker:     { hosts: { vps2: } }   # Monitoring, ELK, backup target
    k3s_server: { hosts: { vps1: } }
    k3s_agent:  { hosts: { vps2: } }
    monitoring: { hosts: { vps2: } }
    elk:        { hosts: { vps2: } }
