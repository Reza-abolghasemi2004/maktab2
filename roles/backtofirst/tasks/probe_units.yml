---
# service_facts includes stale/not-found units and does not list timers.
- name: Check which deployment systemd units are actually loaded
  ansible.builtin.command:
    argv: [systemctl, show, --property=LoadState, --value, "{{ item }}"]
  loop:
    - maktab-backup.timer
    - maktab-backup.service
    - teleport.service
    - prometheus-node-exporter.service
    - nginx.service
    - bind9.service
    - named.service
    - nfs-server.service
    - wg-quick@wg0.service
  register: backtofirst_units
  changed_when: false
  failed_when: backtofirst_units.rc != 0 and (backtofirst_units.stdout | trim) != 'not-found'

