---
- name: Wait for all nodes Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }

- name: Namespaces
  kubernetes.core.k8s: { state: present, template: namespaces.yml.j2 }

- name: NFS dynamic provisioner (StorageClass nfs-client, RWX)
  kubernetes.core.k8s: { state: present, template: nfs-provisioner.yml.j2 }

- name: Secrets (apps + data)
  kubernetes.core.k8s: { state: present, template: secrets.yml.j2 }
  no_log: true

- name: NetworkPolicies (default-deny + explicit allows)
  kubernetes.core.k8s: { state: present, template: netpol.yml.j2 }

- name: CloudNativePG operator (PostgreSQL cluster)
  ansible.builtin.command: "k3s kubectl apply --server-side --force-conflicts -f {{ cnpg_manifest_url }}"
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: false

- name: Wait for CloudNativePG cluster API to become available
  ansible.builtin.command: k3s kubectl wait --for=condition=Established crd/clusters.postgresql.cnpg.io --timeout=180s
  changed_when: false

- name: kube-state-metrics + in-cluster blackbox (for Prometheus)
  kubernetes.core.k8s: { state: present, template: monitoring-agents.yml.j2 }

# Apply a versioned local manifest so image overrides survive every rerun,
# including init containers. The upstream URL still supplies all other objects.
- name: Create ArgoCD manifest directory
  ansible.builtin.file:
    path: /var/lib/maktab/manifests
    state: directory
    mode: "0755"

- name: Download upstream ArgoCD manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
    dest: "/var/lib/maktab/manifests/argocd-{{ argocd_version }}-upstream.yaml"
    mode: "0644"

- name: Read upstream ArgoCD manifest
  ansible.builtin.slurp:
    src: "/var/lib/maktab/manifests/argocd-{{ argocd_version }}-upstream.yaml"
  register: argocd_upstream_manifest

- name: Ensure ArgoCD image reference is present before replacing it
  ansible.builtin.assert:
    that:
      - "('quay.io/argoproj/argocd:' ~ argocd_version) in (argocd_upstream_manifest.content | b64decode)"
      - argocd_image | length > 0
    fail_msg: "ArgoCD upstream image reference was not found; check argocd_version and upstream manifest before proceeding."

- name: Render ArgoCD manifest with selected image
  ansible.builtin.copy:
    dest: "/var/lib/maktab/manifests/argocd-{{ argocd_version }}-rendered.yaml"
    mode: "0644"
    content: "{{ (argocd_upstream_manifest.content | b64decode) | replace('quay.io/argoproj/argocd:' ~ argocd_version, argocd_image) }}"

- name: Install ArgoCD
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - --server-side
      - --force-conflicts
      - -n
      - argocd
      - -f
      - "/var/lib/maktab/manifests/argocd-{{ argocd_version }}-rendered.yaml"
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: false

# A StatefulSet rolling update can wait indefinitely on an old unready Pod.
# Only replace this specific old, image-pull-failing Pod after applying the new
# template; do not delete healthy controllers or workloads with user data.
- name: Inspect ArgoCD application controller pod
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Pod
    namespace: argocd
    name: argocd-application-controller-0
  register: argocd_controller_pod

- name: Replace old ArgoCD controller pod stuck pulling its previous image
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: argocd
    name: argocd-application-controller-0
  when:
    - argocd_controller_pod.resources | length == 1
    - (argocd_controller_pod.resources[0].metadata.ownerReferences | default([]) | selectattr('kind', 'equalto', 'StatefulSet') | selectattr('name', 'equalto', 'argocd-application-controller') | list | length) == 1
    - argocd_controller_pod.resources[0].spec.containers | length == 1
    - argocd_controller_pod.resources[0].spec.containers[0].image != argocd_image
    - argocd_controller_pod.resources[0].status.containerStatuses | default([]) | length == 1
    - not (argocd_controller_pod.resources[0].status.containerStatuses[0].ready | default(false) | bool)
    - argocd_controller_pod.resources[0].status.containerStatuses[0].state.waiting.reason | default('') in ['ImagePullBackOff', 'ErrImagePull']

- name: Wait for the ArgoCD application API to become available
  ansible.builtin.command: k3s kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=180s
  changed_when: false

- name: ArgoCD behind nginx (HTTP internally) + NodePort
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: argocd-cmd-params-cm, namespace: argocd }
      data: { "server.insecure": "true" }
  notify: restart argocd-server
- kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Service
      metadata: { name: argocd-server, namespace: argocd }
      spec:
        type: NodePort
        ports:
          - { name: http, port: 80, targetPort: 8080, nodePort: "{{ np_argocd }}" }
