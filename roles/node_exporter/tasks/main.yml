---
- ansible.builtin.apt: { name: prometheus-node-exporter, state: present }
- ansible.builtin.file: { path: "{{ node_exporter_textfile_dir }}", state: directory, mode: "0755" }
- name: Listen on VPN IP only + textfile collector (backup metrics)
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: |
      ARGS="--web.listen-address={{ wg_ip }}:9100 --collector.textfile.directory={{ node_exporter_textfile_dir }}"
  register: ne_cfg
- ansible.builtin.service: { name: prometheus-node-exporter, state: started, enabled: true }
- ansible.builtin.service: { name: prometheus-node-exporter, state: restarted }
  when: ne_cfg.changed
